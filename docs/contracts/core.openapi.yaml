openapi: 3.1.0
info:
  title: QC Warehouse R1 core transaction contracts
  version: 1.0.0
  description: 交易写链及轨迹读取。其余端点按开发规格指定章节。cookieSession包括临时onboarding会话，授权按x-roles。
servers:
- url: /api/v1
paths:
  /auth/registration/complete:
    post:
      operationId: completeRegistration
      summary: 校验已验证邮箱及短时身份，在一个事务领码
      security:
      - cookieSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - terms_version_ids
              properties:
                terms_version_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
              additionalProperties: false
  /orders:
    post:
      operationId: createDraft
      summary: 创建多项目草稿
      security:
      - cookieSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - lines
              properties:
                lines:
                  type: array
                  items:
                    $ref: '#/components/schemas/Line'
                  minItems: 1
                customer_notes:
                  type: string
                  minLength: 1
              additionalProperties: false
  /orders/{id}:
    patch:
      operationId: editDraft
      summary: 校验草稿版本及所有权
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              - lines
              properties:
                revision:
                  type: integer
                  minimum: 1
                lines:
                  type: array
                  items:
                    $ref: '#/components/schemas/Line'
                  minItems: 1
              additionalProperties: false
  /orders/{id}/payment:
    get:
      operationId: orderPayment
      summary: 按原订单读取当前检查收费及可恢复付款状态
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current inspection payment
          content:
            application/json:
              schema:
                type: object
                required: [state, charge]
                properties:
                  state:
                    enum: [not_due, open, processing, expired, paid]
                  charge:
                    oneOf:
                    - type: 'null'
                    - type: object
                      required: [id, amount_cents, quote_revision, expires_at]
                      properties:
                        id:
                          type: string
                          format: uuid
                        amount_cents:
                          type: integer
                          minimum: 0
                        quote_revision:
                          type: integer
                          minimum: 1
                        expires_at:
                          type: string
                          format: date-time
                      additionalProperties: false
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - customer
  /orders/{id}/quotes:
    post:
      operationId: quoteOrder
      summary: 核验逐行能力、数量档、附加项及交期后锁定价格
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
              additionalProperties: false
  /orders/{id}/submit:
    post:
      operationId: submitOrder
      summary: 接受尚有效的报价并创建收费项
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - order
                - charge
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  charge:
                    $ref: '#/components/schemas/Charge'
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              - quote_id
              - terms_version_ids
              - acknowledgements
              properties:
                revision:
                  type: integer
                  minimum: 1
                quote_id:
                  type: string
                  format: uuid
                terms_version_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                acknowledgements:
                  type: object
                  required:
                  - scope_notice
                  - samples_not_batch
                  - seller_refund_is_mine
                  - no_certification
                  - restricted_items
                  properties:
                    scope_notice:
                      const: true
                    samples_not_batch:
                      const: true
                    seller_refund_is_mine:
                      const: true
                    no_certification:
                      const: true
                    restricted_items:
                      const: true
                  additionalProperties: false
              additionalProperties: false
  /charges/{id}/checkout:
    post:
      operationId: checkout
      summary: 创建或复用 Stripe Checkout 尝试
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quote_revision
              properties:
                quote_revision:
                  type: integer
                  minimum: 1
              additionalProperties: false
  /me/parcels:
    post:
      operationId: adviseParcel
      summary: 允许零订单登记或关联多个本人订单
      security:
      - cookieSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tracking_no
              - address_id
              properties:
                tracking_no:
                  type: string
                  minLength: 1
                address_id:
                  type: string
                  format: uuid
                carrier_code:
                  type: string
                  minLength: 1
                order_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 0
              additionalProperties: false
  /staff/intake/lookup:
    post:
      operationId: lookupParcel
      summary: 按实际运单查询，歧义交人工核实
      security:
      - cookieSession: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - match_state
                - order_ids
                properties:
                  match_state:
                    type: string
                    enum:
                    - unmatched
                    - user_only
                    - matched
                    - ambiguous
                  order_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    minItems: 0
                  receiving_code:
                    type: string
                    minLength: 1
                  advice_id:
                    type: string
                    format: uuid
                  package_id:
                    type: string
                    format: uuid
                  candidate_count:
                    type: integer
                    minimum: 0
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - receiver
      - warehouse_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tracking_no
              properties:
                tracking_no:
                  type: string
                  minLength: 1
                carrier_code:
                  type: string
                  minLength: 1
              additionalProperties: false
  /staff/intake/check-in:
    post:
      operationId: checkIn
      summary: 实收后记录入仓；可在无委托时操作
      security:
      - cookieSession: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - receiver
      - warehouse_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tracking_no
              - outer_media_ids
              properties:
                tracking_no:
                  type: string
                  minLength: 1
                outer_media_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                carrier_code:
                  type: string
                  minLength: 1
                weight_g:
                  type: integer
                  minimum: 1
                advice_id:
                  type: string
                  format: uuid
              additionalProperties: false
  /staff/packages/{id}/items:
    post:
      operationId: intakeItems
      summary: 每件入库编号，可分批拆包
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - item_ids
                - revision
                properties:
                  item_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
                    minItems: 1
                  revision:
                    type: integer
                    minimum: 1
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - receiver
      - warehouse_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              - items
              properties:
                revision:
                  type: integer
                  minimum: 1
                items:
                  type: array
                  items:
                    type: object
                    required:
                    - code
                    - location_id
                    properties:
                      code:
                        type: string
                        minLength: 1
                      location_id:
                        type: string
                        format: uuid
                      component_of:
                        type: string
                        format: uuid
                    additionalProperties: false
                  minItems: 1
              additionalProperties: false
  /staff/items/{id}/assign:
    post:
      operationId: assignItem
      summary: 实物归属、委托位置及识别证据核对后绑定
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - assignment_id
                - revision
                properties:
                  assignment_id:
                    type: string
                    format: uuid
                  revision:
                    type: integer
                    minimum: 1
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - receiver
      - warehouse_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              - order_line_id
              - expected_item_id
              - evidence_ids
              properties:
                revision:
                  type: integer
                  minimum: 1
                order_line_id:
                  type: string
                  format: uuid
                expected_item_id:
                  type: string
                  format: uuid
                evidence_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
              additionalProperties: false
  /staff/inspection-tasks/{id}/start:
    post:
      operationId: startTask
      summary: 锁定本任务，允许同订单其他独立任务同时作业
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - inspector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
              additionalProperties: false
  /staff/inspection-tasks/{id}/results:
    put:
      operationId: recordResults
      summary: 按锁定模板检查类型、单位、证据与原因，整批写入
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - inspector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              - results
              properties:
                revision:
                  type: integer
                  minimum: 1
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/Result'
                  minItems: 1
              additionalProperties: false
  /staff/inspection-tasks/{id}/submit:
    post:
      operationId: submitTask
      summary: 检查完整性并交复核
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - inspector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
              additionalProperties: false
  /staff/orders/{id}/report/submit:
    post:
      operationId: submitReport
      summary: 按全部委托范围核验任务并冻结候选快照
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - inspector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - task_ids
              - revision
              properties:
                task_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                revision:
                  type: integer
                  minimum: 1
              additionalProperties: false
  /staff/reports/{id}/reject:
    post:
      operationId: returnReport
      summary: 独立复核员按版本退回首份未发布报告并记录修改原因
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        required: true
        in: header
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, reason]
              properties:
                revision:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 4
                  maxLength: 1200
              additionalProperties: false
      responses:
        '200':
          description: Returned to inspection
          content:
            application/json:
              schema:
                type: object
                required: [id, version, state]
                properties:
                  id:
                    type: string
                    format: uuid
                  version:
                    type: integer
                    minimum: 1
                  state:
                    const: draft
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - reviewer
  /staff/reports/{id}/approve:
    post:
      operationId: approveReport
      summary: 独立审批后异步生成PDF，等待发布
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - reviewer
      - super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - checklist
              - revision
              properties:
                checklist:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                revision:
                  type: integer
                  minimum: 1
              additionalProperties: false
  /orders/{id}/dispositions:
    post:
      operationId: instruct
      summary: 仅授权本人实物，商家寄回需客户提供地址
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instruction'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - item_id
              - action
              - terms_version_id
              properties:
                item_id:
                  type: string
                  format: uuid
                action:
                  type: string
                  enum:
                  - to_forwarder
                  - to_domestic_address
                  - return_to_seller
                  - retain
                  - reserve_reference
                terms_version_id:
                  type: string
                  format: uuid
                destination:
                  type: object
                  properties:
                    recipient:
                      type: string
                      minLength: 1
                    phone:
                      type: string
                      minLength: 1
                    address:
                      type: string
                      minLength: 1
                    member_code:
                      type: string
                      minLength: 1
                  required:
                  - recipient
                  - phone
                  - address
                  additionalProperties: false
                return_info:
                  type: object
                  required:
                  - requested_from_seller
                  - customer_pays_shipping
                  properties:
                    requested_from_seller:
                      const: true
                    customer_pays_shipping:
                      const: true
                    deadline:
                      type: string
                      format: date-time
                  additionalProperties: false
              additionalProperties: false
              allOf:
