        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - refund_id
                - state
                properties:
                  refund_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    minLength: 1
                additionalProperties: false
        default:
