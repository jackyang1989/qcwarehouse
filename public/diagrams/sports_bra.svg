  <text x="20" y="335" font-family="sans-serif" font-size="11" fill="#334155">A: 肩带至下摆长 Strap-to-Hem · B: 胸宽平铺 Bust Flat · C: 底围平铺 Underband Flat · D: 侧缝高 Side Seam</text>
