<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
  <rect width="520" height="360" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">TOPS / SHIRT MEASUREMENT DIAGRAM · 上衣平铺测量示意图</text>
  <!-- Garment silhouette -->
  <path d="M180 65 L220 55 Q260 72 300 55 L340 65 L395 130 L360 155 L330 115 L330 300 L190 300 L190 115 L160 155 L125 130 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <!-- A: Body Length -->
  <line x1="235" y1="58" x2="235" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="235" cy="180" r="10" fill="#dc2626"/>
  <text x="235" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">A</text>
  <!-- B: Shoulder Width -->
  <line x1="180" y1="65" x2="340" y2="65" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="260" cy="65" r="10" fill="#2563eb"/>
  <text x="260" y="69" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">B</text>
  <!-- C: Chest Flat Width -->
  <line x1="190" y1="135" x2="330" y2="135" stroke="#059669" stroke-width="2"/>
  <circle cx="285" cy="135" r="10" fill="#059669"/>
  <text x="285" y="139" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">C</text>
  <!-- D: Hem Flat Width -->
  <line x1="190" y1="290" x2="330" y2="290" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="285" cy="290" r="10" fill="#7c3aed"/>
  <text x="285" y="294" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">D</text>
  <!-- E: Sleeve Length -->
  <line x1="340" y1="65" x2="395" y2="130" stroke="#d97706" stroke-width="2"/>
  <circle cx="370" cy="96" r="10" fill="#d97706"/>
  <text x="370" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">E</text>
  <!-- Legend -->
  <text x="20" y="335" font-family="sans-serif" font-size="11" fill="#334155">A: 衣长 Body Length (HPS to Hem) · B: 肩宽 Shoulder · C: 胸宽 Chest Flat · D: 下摆宽 Hem Flat · E: 袖长 Sleeve</text>
</svg>