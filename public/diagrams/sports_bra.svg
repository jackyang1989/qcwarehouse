  <!-- A: Strap-to-Hem Length -->
  <line x1="218" y1="60" x2="218" y2="255" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="218" cy="155" r="10" fill="#dc2626"/>
  <text x="218" y="159" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">A</text>
  <!-- B: Bust Flat Width -->
  <line x1="186" y1="165" x2="334" y2="165" stroke="#059669" stroke-width="2"/>
