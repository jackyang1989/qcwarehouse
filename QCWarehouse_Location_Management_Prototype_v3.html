function sidebar(g,path){if(g==='public'||g==='all')return '';const zh=g==='warehouse'||g==='admin';return `<aside class="sidebar"><div class="eyebrow">${zh?'OPERATIONS CONSOLE':'CUSTOMER PORTAL'}</div><div class="sb-title">${zh?(g==='warehouse'?'仓库工作台':'运营管理后台'):'My Workspace'}</div><p class="sb-caption">${zh?'作业数据均为演示记录；所有敏感操作仅模拟':'Sample inspections, reports and handling in one place.'}</p>${(navGroup[g]||[]).map(gr=>`<div class="nav-group"><div class="name">${gr[0]}</div>${gr[1].map(p=>`<a href="#${p}" class="${p===path?'active':''}"><span><span class="nicon">${['/wh/scan','/orders/new'].includes(p)?'＋':'▣'}</span>${e(titleOf(p))}</span></a>`).join('')}</div>`).join('')}<div class="sidebar-note"><b>${zh?'操作规则':'Inspection evidence'}</b>${zh?'仓库实际签收、付款与承运商签收分别核实；不得按演示状态执行实物操作。':'Each inspected sample has traceable evidence, a versioned report and a separate handling instruction.'}</div></aside>`}
function globalFooter(){return `<footer class="site-footer"><span><b>QCWarehouse</b> · Independent Product Inspection & Sample Comparison in China</span><span>${link(R.terms,'Terms')} &nbsp; ${link(R.privacy,'Privacy')} &nbsp; ${link(R.contact,'Contact')}</span></footer>`}
function head(title,sub='',actions='',id=''){return `<div class="breadcrumb">${link(R.home,'QCWarehouse')} &nbsp; / &nbsp; <b>${e(title)}</b> ${id?` &nbsp; <span class="route-id">PAGE-${id}</span>`:''}</div><div class="page-head"><div><div class="eyebrow">${id.startsWith('H')?'WAREHOUSE OPERATIONS':id.startsWith('M')?'OPERATIONS MANAGEMENT':id.startsWith('C')?'CUSTOMER WORKSPACE':'QCWAREHOUSE PLATFORM'}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="head-actions">${actions}</div></div>`}
function layout(path,content){const g=activeGroup(path);document.documentElement.lang=['warehouse','admin'].includes(g)?'zh-CN':'en';document.title=`${titleOf(path)} — QCWarehouse Prototype`;$('#app').innerHTML=`${header(g)}<div class="test-banner">INTERACTIVE PROTOTYPE · Synthetic sample records · Changes are stored only in this browser · No real payment, login, shipment, or published reports</div>${g==='public'||g==='all'?`<div class="front-wide">${content}${globalFooter()}</div>`:`<div class="layout">${sidebar(g,path)}<main class="main">${content}${globalFooter()}</main></div>`}<button class="page-picker" data-go="${R.all}">☷ &nbsp; All screens · ${PAGES.length}</button>`;window.scrollTo({top:0,behavior:'auto'});}
function toast(message){const t=document.createElement('div');t.className='toast-item';t.textContent=message;$('#toast').append(t);setTimeout(()=>t.remove(),3500)}
function modal(title,body,okLabel='Close',action='close-modal'){const el=$('#modal');el.innerHTML=`<div class="modal-back" role="dialog" aria-modal="true"><div class="modal-box"><div class="modal-head"><h2>${title}</h2><button class="btn sm" data-action="close-modal" aria-label="Close dialog">✕</button></div><div class="modal-body">${body}</div><div class="modal-actions">${act(okLabel,action,'primary')}</div></div></div>`;el.querySelector('.btn')?.focus()}
const closeModal=()=>$('#modal').innerHTML='';
function section(label,content){return `<div class="front-section"><h2>${label}</h2>${content}</div>`}
function statusText(status){const x=String(status).toLowerCase();return tag(status,x.includes('complete')||x.includes('ready')||x.includes('published')||x.includes('received')||x.includes('paid')?'green':x.includes('wait')||x.includes('pending')||x.includes('draft')||x.includes('review')?'yellow':x.includes('block')||x.includes('restrict')||x.includes('reject')?'red':'blue')}
function orderUrl(o){return o.id===O?R.order:'/orders/'+o.id}
function orderDetailLink(o){return link(orderUrl(o),e(o.id),'mono')}
function orderTable(source=state.orders){return tbl(['Order / Date','Service','Category','Items','Service fee','Current status',''],source.map(o=>[`${orderDetailLink(o)}<div class="muted small">${o.created}</div>`,e(o.service),e(o.category),String(o.items),money(o.amount),statusText(o.status),B('Open',orderUrl(o),'sm')]))}
function newQuote(){const w=state.wizard;if(w.category!=='apparel')return null;let base=w.service==='inspection'?29*Math.max(1,Number(w.qty)):w.service==='compare'?(Number(w.qty)===2?59:state.catalogPrice+Math.max(0,Number(w.qty)-3)*30):45;return base;}
function servicesCards(){const data=[['Product Inspection','1–N items, individually documented checks','⌕',R.inspection,'Per-item service'],['Sample Comparison','Compare 2–3 or more compatible samples side by side','⇄',R.compare,'Comparison service'],['Reference Sample Matching','Compare new samples against an approved reference','▱',R.reference,'Approved reference']];return `<div class="grid cols3">${data.map(a=>`<div class="card card-link">${link(a[3],`<div style="font-size:26px;color:#1e66c4">${a[2]}</div><h3 style="margin:12px 0 7px;color:#17334f">${a[0]}</h3>`)}<p class="small">${a[1]}</p><div class="row between">${tag(a[4],'blue')}${link(a[3],'Explore →')}</div></div>`).join('')}</div>`}
function publicHome(){return `<div class="hero"><div class="eyebrow">CHINA-BASED / THIRD-PARTY / EVIDENCE FIRST</div><h1>Product Inspection &<br>Sample Comparison in China</h1><p>Structured product checks for overseas brands, online sellers and independent retailers. Know what arrived before you ship it internationally.</p><div class="row flexwrap" style="margin-top:25px">${B('Start an Inspection →',R.new,'primary lg')}${B('View Sample Report',R.sample,'lg')}</div><div style="margin-top:29px;color:#b1d7ff;font-size:12px">✓ Traceable sample IDs &nbsp; &nbsp; ✓ Documented observations &nbsp; &nbsp; ✓ Clear scope limits</div><div class="hero-visual"><div class="vcard"><div class="row between"><strong>Inspection snapshot</strong>${tag('DEMO','yellow')}</div><div class="vline"></div><div class="vline"></div><div class="vline"></div><div class="vline"></div><span class="vchip">Evidence recorded</span></div></div></div><div class="grid cols4">${[['China inspection center','Ship samples from any supplier'],['Template-based checks','Consistent scope by category'],['Evidence-based reports','Photos, measurements, observations'],['Per-item handling','Keep, forward or return on instruction']].map(x=>`<div class="card flat"><strong>${x[0]}</strong><p class="small" style="margin:8px 0 0">${x[1]}</p></div>`).join('')}</div>${section('Inspection services',servicesCards())}${section('Built as multi-category inspection infrastructure',`${note('<strong>Apparel services are available for the initial operating scope.</strong> Planned categories are not available for payment until operational approval.')}<div class="grid cols3" style="margin-top:15px">${CATS.slice(0,6).map(c=>`<div class="card flat"><div class="row between"><strong>${e(c.name)}</strong>${tag(c.state==='ACTIVE'?'Available':c.state==='PLANNED'?'Planned':'Restricted',c.state==='ACTIVE'?'green':'gray')}</div><p class="small" style="margin:9px 0 13px">${e(c.desc)}</p>${link(c.state==='ACTIVE'?R.inspection:R.contact,c.state==='ACTIVE'?'View service →':'Request availability →')}</div>`).join('')}</div>`)}${section('A transparent process',`<div class="grid cols5">${[['01','Choose service'],['02','Send your products'],['03','Receive & identify'],['04','Inspect and compare'],['05','Review & decide']].map(x=>`<div class="card flat"><span class="number-tile">${x[0]}</span><h3 style="margin:12px 0 5px">${x[1]}</h3><p class="small">Versioned records and documented handoffs.</p></div>`).join('')}</div>`)}${section('An inspection report built for decisions',`<div class="grid cols2"><div>${reportSummary(true)}</div><div class="card"><h2>What was checked. What was observed. What was not tested.</h2><p>Measurements include a method and unit. Photos are associated with exact samples. Unchecked items are always visible.</p>${B('Explore the sample report →',R.sample,'primary')}</div></div>`)}${card(`${cardTitle('Ready to inspect your first sample?','Transparent scope. Independent observations. No sourcing agency or laboratory certification claims.')}<div class="row flexwrap">${B('Start an Order',R.new,'primary')}${B('How the process works',R.how)}</div>`)}`}
function categoryTiles(){return `<div class="grid cols3">${CATS.map(c=>`<div class="card flat"><div class="category-card"><div class="glyph">${e(c.icon)}</div><div style="flex:1"><div class="row between"><strong>${e(c.name)}</strong>${statusText(c.state==='ACTIVE'?'Available':c.state==='PLANNED'?'Planned':'Restricted')}</div><p>${e(c.desc)}</p><div class="row flexwrap">${c.state==='ACTIVE'?B('Select category →',R.new,'primary sm'):B('Ask about this category',R.contact,'sm')}</div></div></div></div>`).join('')}</div>`}
function renderService(s){const isComp=s==='compare',isRef=s==='reference';const title=isComp?'Sample Comparison':isRef?'Reference Sample Matching':'Product Inspection';const sub=isComp?'Compare equivalent samples under the same inspection conditions.':isRef?'Evaluate new samples against a reference you approve and authorize us to retain.':'Visual quality, dimensional checks and observable workmanship, item by item.';return `${head(title,sub,B('Start This Service',R.new,'primary'),'W02'+(isComp?'a':isRef?'c':'b'))}<div class="small-hero"><div class="row between flexwrap"><div><div class="label">SERVICE FRAMEWORK / APPAREL LIVE</div><h2 style="margin:9px 0">${title}</h2><p style="max-width:560px">${sub}</p><div class="row flexwrap">${tag('Versioned checklist','blue')}${tag('Sample-level evidence','green')}${tag('Report available','blue')}</div></div><div class="product-illustration" style="width:190px;max-width:100%">${appimg()}</div></div></div><div class="grid cols2">${card(`${cardTitle('What we inspect','Select only checks approved for the product category.')}<ul class="list"><li><span class="idx">1</span>Sample identity, quantity and packaging</li><li><span class="idx">2</span>Visual condition, workmanship and visible damage</li><li><span class="idx">3</span>Applicable measurements and photo evidence</li><li><span class="idx">4</span>${isComp?'Side-by-side matrix and observable differences':isRef?'Reference sample discrepancies and declared tolerance':'Individual findings and exceptions'}</li></ul>`)}${card(`${cardTitle('Scope and availability','Exact contents depend on the chosen category and template.')}<div class="metric-list">${['Apparel ACTIVE','Laboratory tests not included','Other categories gated','Domestic forwarding optional'].map(t=>`<div class="metric-box"><div class="cap">SERVICE CONDITION</div><strong>${t}</strong></div>`).join('')}</div><div class="sep"></div>${B('View sample report',R.sample,'sm')} ${B('Pricing',R.pricing,'sm')}`)}</div>${isComp?card(`${cardTitle('Number of comparison samples','Set up a realistic inspection group.') }<div class="row flexwrap">${['2','3','4'].map(n=>act(n+' samples','quick-quantity','sm',`data-qty="${n}" data-service="compare"`)).join('')}</div><p class="small muted" style="margin:12px 0 0">Additional samples must be compatible with the selected inspection template. Four-sample pricing is an unapproved draft assumption.</p>`):''}${card(`${cardTitle('How to start','Customer purchases goods independently and sends them to our China location.')}<div class="row flexwrap">${B('Create Inspection',R.new,'primary')}${B('Process Details',R.how)}</div>`)}`}
function pricingPage(){return `${head('Service Pricing','Test prices are illustrative. Approved pricing and processing capacity govern real orders.',B('Get Started',R.new,'primary'),'W03')}${note('PROTOTYPE PRICES / NOT LIVE QUOTES. Product inspection fee is separate from shipping, additional handling, storage and any tax.','warning')}<div class="grid cols3" style="margin-top:18px">${[['Individual Inspection','From $29','per apparel item','Single or multiple physical samples, each checked separately.','inspection'],['Sample Comparison','$99','three-sample apparel set','2-sample trial $59; extra comparable sample $30 in the draft model.','compare'],['Reference Matching','~ $39–49','per new comparison','Reference acquisition and storage are separately priced.','reference']].map(p=>`<div class="card"><div class="label">${p[0]}</div><h2 style="margin:14px 0 2px">${p[1]}</h2><div class="small muted">${p[2]}</div><p style="min-height:65px;margin:20px 0">${p[3]}</p>${B('Configure inspection',R.new,'primary full')}</div>`).join('')}</div>${card(`${cardTitle('Estimate the inspection fee','Select a trial service and sample quantity. Values are assumptions, not a binding quote.') }<div class="fields">${select('Service','pricing-service',[['inspection','Individual Inspection'],['compare','Sample Comparison'],['reference','Reference Matching']],'compare')}${select('Quantity','pricing-qty',[['1','1 item'],['2','2 items'],['3','3 items'],['4','4 items'],['5','5 items'],['30','30 items']],'3')}</div><div class="display-quote" style="margin-top:16px"><div class="label">Demo estimate, excl. shipping</div><div id="price-preview" class="big">${money(state.catalogPrice)}</div><div class="small muted">Exact eligibility, scope, capacity and item count are checked before order payment.</div></div>`)}${tbl(['Charge type','When charged','Remarks'],[['Inspection fee','After scope approval','Before inspection work begins'],['Domestic forwarding','After item selection and weighing','Quote per package, not part of inspection fee'],['Storage extension','After free storage ends','Per-item, configurable by policy'],['Refund / adjustment','Only after review','Approval is not a completed refund']])}`}
function howPage(){const steps=[['Register & get your receiving code','Every account receives a permanent personal parcel code and the current common receiving address.'],['Buy from your supplier','Purchase yourself; share the receiving details with a domestic Chinese seller or factory.'],['Track and identify parcels','Record the seller’s actual carrier tracking number. Warehouse receipt is confirmed independently from carrier delivery.'],['Inspection & quality review','Inspect by approved category template; attach evidence to exact samples and run independent review.'],['Review report & direct handling','Receive a versioned report; tell us exactly which items to store, consolidate, forward or return.']];return `${head('How It Works','A clear chain of custody from a seller’s parcel to a documented inspection report.',B('Create Inspection',R.new,'primary'),'W04a')}${card(`<div class="grid cols5">${steps.map((x,i)=>`<div><span class="number-tile">0${i+1}</span><h3 style="margin:13px 0 8px">${x[0]}</h3><p class="small">${x[1]}</p></div>`).join('')}</div>`)}${card(`${cardTitle('Who is responsible?')} ${tbl(['Action','Customer','QCWarehouse'],[['Purchase & supplier payment',tag('Responsible','blue'),'Not provided'],['Initial domestic shipment',tag('Provide tracking','blue'),'Track / receive'],['Physical inspection','Specify requested scope',tag('Executes approved checks','green')],['Return authorization','Obtain address / request return',tag('Ship upon instruction','green')],['International shipping','Arrange with your forwarder','Domestic handoff only when authorized']])}`)}${note('The inspection start date is calculated only after the agreed samples are physically received, identified, and the service scope and payment are confirmed.')}`}
const FAQS=[['Shipping samples','Do I buy products from the supplier myself?','Yes. You pay the supplier directly and have items sent to your QCWarehouse receiving details.'],['Shipping samples','Can parcels arrive before I place an inspection order?','Yes. Receiving codes are assigned on registration. Verified items may be held pending an inspection instruction.'],['Inspection','Can I inspect 30 pieces of the same product?','Yes. Product Inspection is item-based; a three-sample comparison is a separate service, not a limit on inspections.'],['Inspection','Do you test fabric composition or safety certification?','No. Basic visual inspection and measurements are not laboratory material or safety certification.'],['Reports','Can I share a report?','Reports may be shared only by explicitly authorized, time-limited links. The prototype shows synthetic report data.'],['Reports','Can published reports be changed?','A revision creates a new version with a reason. Historical versions are retained.'],['Payments','Can I use my own freight forwarder?','Yes. Domestic transfer is quoted separately and requires your precise item-level authorization.'],['Handling','Will you negotiate a seller refund?','No. You must request the return from the seller and supply the seller’s designated return address. We can arrange authorized domestic forwarding.'],['Handling','Can you combine items from several of my orders?','Yes, subject to exact item selection, package limits, revised quote and your explicit confirmation. Items from different customers are never combined.']];
function faqPage(){const selected=(location.hash.match(/faq=(\d+)/)||[])[1];return `${head('Frequently Asked Questions','Search by subject, and expand each answer.',B('Ask a question',R.contact,'primary'),'W04b')}${card(`<div class="selectbar"><div class="search"><input id="faq-search" aria-label="Search FAQ" placeholder="Search shipping, inspection, reports, payments…"></div>${act('Clear','clear-faq','sm')}</div><div id="faq-items">${FAQS.map((f,i)=>`<details class="faq-item" data-faq="${e(f.join(' ').toLowerCase())}" id="faq-${i+1}" ${String(i+1)===selected?'open':''}><summary>${f[1]} <span class="tag gray">${f[0]}</span></summary><p>${f[2]}</p>${act('Copy direct link','copy-faq','sm',`data-faq-index="${i+1}"`)}</details>`).join('')}</div>`)}`}
function reportSummary(mini=false){return `${mini?'<div class="card">':''}<div class="row between flexwrap"><div><div class="label">QCWarehouse · Inspection report</div><h3 style="margin:6px 0 4px">Apparel Sample Comparison</h3><div class="small muted">Report RPT-102 · Version 2 · ${O}</div></div>${tag('DEMONSTRATION','yellow')}</div><div class="sep"></div><div class="grid cols3">${['S-003101','S-003102','S-003103'].map((a,i)=>`<div class="data-sample"><strong class="mono">${a}</strong><div class="product-illustration" style="margin:9px 0;height:96px">${appimg()}</div><div class="small muted">${['Reference A','Supplier B','Supplier C'][i]}</div></div>`).join('')}</div>${mini?'</div>':''}`}
function measurementTable(){return tbl(['Measurement / Method','Sample A','Sample B','Sample C','Unit'],[['Length · lay flat',`72.0`,`${71.8}`,`72.2`,'cm'],['Chest · lay flat','56.0','55.8','56.1','cm'],['Shoulder','48.0','48.0','48.1','cm'],['Sleeve','22.0','21.9','22.0','cm']])}
function reportView(publicDemo=false,old=false){const v=old?1:state.reportVersion;return `<div class="report-print">${card(`${reportSummary()}<div class="grid cols4" style="margin-top:14px">${def('Inspection date','2026-11-04 CST')}${def('Category','Apparel / Tops')}${def('Method','Visual & tape measurement')}${def('Evidence','8 illustrative frames')}</div>`)}${card(`${cardTitle('Measurements & comparative observations','Select a measurement value in a real implementation to see its linked measurement photo.')}${measurementTable()}<p class="small muted" style="margin-top:10px">Reference values and tolerances supplied by the buyer are required before making an acceptance judgment.</p>`)}${card(`${cardTitle('Photo evidence','Illustrative placeholders only. No actual inspected item photo is included in this prototype.')}<div class="photo-grid">${['Sample A — Front','Sample A — Back','Sample B — Detail','Sample C — Print','Seam close-up','Tape measurement'].map(s=>photocard(s)).join('')}</div>`)}${card(`${cardTitle('Findings and limitations')}<ul class="list"><li>✓ Slight visible stitch spacing differences were noted on Sample B.</li><li>✓ Dimensions are recorded by sample, with stated measurement method.</li><li>— Fabric fiber composition, color ΔE and laboratory durability were not tested.</li><li>— This inspection does not certify any unobserved units or production batch.</li></ul>${old?note('Historical report v1. This version is immutable. Later changes are shown only in subsequent versions.','warning'):note('Report v2 has a revision history. A published report cannot be silently overwritten.','success')}`)}</div>`}
function samplePage(){return `${head('Sample Inspection Report','Explore the structure of an evidence-based comparison report. The content below is synthetic.',B('Start Inspection',R.new,'primary'),'W05')}${note('DEMO CONTENT — This sample contains synthetic values and illustrative placeholders, not verified customer product evidence.','warning')}${reportView(true)}${B('See full report workspace',R.report,'sm')}`}
function categoriesPage(){return `${head('Product Categories','One platform. Inspection methods and service availability are controlled per category.',B('Start Inspection',R.new,'primary'),'W07')}${categoryTiles()}${card(`${cardTitle('Category activation is governed','A future category is not automatically eligible for checkout.')}<div class="grid cols3">${[['1','Versioned template and evidence rules'],['2','Equipment, staff and SOP approved'],['3','Price, service terms and test report validated']].map(x=>`<div class="data-sample"><span class="number-tile">${x[0]}</span><div style="margin-top:10px"><strong>${x[1]}</strong></div></div>`).join('')}</div>`)}`}
function contactPage(){return `${head('Contact Inspection Support','Ask about a service scope, an unavailable product category or custom item quantities.','','W09')}<div class="detail-layout"><div>${card(`<form id="contact-form"><div class="fields">${field('Email','contact-email','you@company.com','', 'email','required')}${select('Category','contact-category',CATS.map(c=>[c.id,c.name]),'apparel')}${field('Estimated sample quantity','contact-count','e.g. 3','3','number','min="1" required')}${field('Company / brand (optional)','contact-company','Your company')}</div><div style="margin-top:16px">${area('What would you like checked?','contact-description','Tell us the product type and your questions…','',1000)}</div><div style="margin-top:17px">${act('Submit enquiry · demo','submit-contact','primary')}</div></form>`)}</div><aside>${card(`<h3>Independent product inspection</h3><p>We can confirm scope feasibility and direct you to the right inspection service. We cannot purchase goods or negotiate supplier refunds.</p>${note('Contact details and enquiry confirmation in this prototype are local simulations only.')}`)}</aside></div>`}
const LEGAL={terms:['Terms of Service','This illustrative draft describes the inspection service boundaries, buyer-owned purchasing relationship, handling authorizations and dispute process. It is NOT approved legal text.','Service orders require a selected scope, disclosed limitations and customer authorization. No laboratory certification or full-batch guarantee is supplied.'],privacy:['Privacy Policy','This prototype does not connect to a production service. Only browser-local synthetic values may be stored. A production privacy policy requires legal review.','Customer evidence and delivery contact information must be access-controlled, with retention and deletion schedules governed by law and agreement.'],restricted:['Restricted Items','The operational categories for electronics, toys, cosmetics and food-contact goods remain restricted until service capability and risk reviews are complete.','Hazardous products, products requiring mandatory certification or unsafe handling may be refused according to a published and approved policy.'],notice:['Report Limitations','Findings reflect only observed samples, the agreed inspection items and the specified testing conditions.','Unchecked items, no-measurement cases, absence of tolerances and photographs cannot establish product or batch certification.']};
function legalPage(p){const k=p.split('/').pop(),d=LEGAL[k]||LEGAL.terms;return `${head(d[0],'DRAFT POLICY / legal review required',B('Return to order',R.new,'sm'),'W06')}${card(`<div class="row between">${tag('DEMO DRAFT','yellow')}<span class="small muted">v0.1 · not effective for production</span></div><div class="sep"></div><h2>1. Scope</h2><p>${d[1]}</p><h2>2. Operational boundaries</h2><p>${d[2]}</p><h2>3. Service records</h2><p>Historical customer consents and the exact policy version at the point of order must remain retrievable. Production terms require jurisdiction-appropriate advice.</p><div class="sep"></div>${B('View all policies',R.terms,'sm')} ${B('Contact',R.contact,'sm')}`)}`}
function sharePage(){return `${head('Shared Inspection Report','A read-only report share has separate access control and revocation.', '', 'W08')}${state.shareEnabled&&state.reportState==='published'?`${note('DEMO SHARE LINK · Only a synthetic report is visible. In production, this page requires a valid, unexpired token with explicit authorization.','warning')}${reportView(true)}`:card(`<div class="empty"><h2>Link unavailable</h2><p>This shared report is revoked or has expired.</p></div>`)}`}
function pagesIndex(){const groups=[['Public website','public'],['Customer portal','customer'],['Warehouse workspace','warehouse'],['Administration','admin']];return `${head('All Prototype Screens',`Browse the complete ${PAGES.length}-route interactive prototype. Each card corresponds to the PRD page catalogue.`,B('Reset Demo Data',R.all,'sm'),'')}${note('This is an offline front-end prototype. Payment, authentication, carrier lookups, emails and file storage are not connected. All financial and sample information is synthetic.','warning')}<div class="sitemap" style="margin-top:17px">${groups.map(g=>card(`<h3>${g[0]}</h3><span class="tag blue">${PAGES.filter(p=>p[3]===g[1]).length} routes</span><div class="sep"></div>${PAGES.filter(p=>p[3]===g[1]).map(p=>link(p[2],`<span class="route-id">PAGE-${p[0]}</span> &nbsp; ${e(p[1])}`)).join('')}`,'flat')).join('')}</div><div style="margin-top:20px">${act('Reset all local prototype records','reset-demo','danger')}</div>`}
function publicPage(p){if(p===R.home)return publicHome();if(p===R.pricing)return pricingPage();if(p===R.how)return howPage();if(p===R.faq)return faqPage();if(p===R.sample)return samplePage();if(p===R.categories)return categoriesPage();if(p===R.contact)return contactPage();if(p===R.share)return sharePage();if(p.startsWith('/legal/'))return legalPage(p);if(p.startsWith('/services/'))return renderService(p.split('/').pop());return pagesIndex();}
function customerLogin(mode='login'){return `${head(mode==='signup'?'Create an Account':'Sign in to QCWarehouse','Continue securely to manage your parcels, inspections and reports.','','C01')}<div style="max-width:480px;margin:0 auto">${card(`<div class="text-center"><h2>Welcome to QCWarehouse</h2><p>Access the independent inspection workspace.</p></div><div class="grid" style="gap:10px;margin-top:23px">${act('Continue with Google','external-login','full','data-provider="Google"')}${act('Continue with Microsoft','external-login','full','data-provider="Microsoft"')}</div><div class="sep"></div><form id="login-form">${field('Notification email','login-email','you@company.com','demo@qcw.test','email','required')}<p class="small muted" style="margin-top:9px">Email is the alternative sign-in method. Demo sign-in uses local-only records.</p><button class="btn primary full" type="submit">Continue with email · demo</button></form><div class="text-center" style="margin-top:16px">${link(R.recovery,'Can’t access your account?')} · ${link(mode==='signup'?R.login:R.signup,mode==='signup'?'Already have an account? Sign in':'Create an account')}</div>`)}${note('No real OAuth provider or email OTP service is connected. The production platform must verify identity on the server, not by an email field alone.','warning')}</div>`}
function onboarding(){return `${head('Finish Setting Up Your Account','Assign your permanent receiving code and verify your notification details.','','C18')}<div class="detail-layout"><div>${card(`<form id="onboarding-form"><div class="fields">${field('Display name','onboard-name','Your business name','Sample Studio','text','required')}${field('Notification email','onboard-email','email@yourcompany.com','demo@qcw.test','email','required')}</div><div style="margin-top:18px" class="row"><input type="checkbox" id="onboard-terms" required><label for="onboard-terms" class="small">I have reviewed the ${link(R.terms,'Terms of Service')} and ${link(R.privacy,'Privacy Policy')} (demo acknowledgment).</label></div><button type="submit" class="btn primary" style="margin-top:18px">Create demo account & receiving code</button></form>`)}</div><aside>${card(`<h3>Your receiving identity</h3><p>Every account gets a permanent code. This code is not the same as a parcel ID, sample ID, or order number.</p><div class="display-quote"><div class="label">EXAMPLE RECEIVING CODE</div><div class="big mono" style="font-size:20px">QCW-8F2K5</div></div>`)}</aside></div>`}
function wizardProgress(){return `<div class="steps">${['Category','Service','Product Details','Scope','Quote & Terms','Pay & Send'].map((x,i)=>`<div class="step ${i===state.wizard.step?'on':i<state.wizard.step?'done':''}"><span class="n">${i<state.wizard.step?'✓':i+1}</span>${x}</div>`).join('')}</div>`}
function wizardContent(){const w=state.wizard,step=w.step;let content='';if(step===0){content=`${card(`${cardTitle('01 &nbsp; Select a Product Category','Only categories with approved operating capabilities can be ordered.')}<div class="grid cols3">${CATS.map(c=>`<div class="option-card ${w.category===c.id?'selected':''} ${c.state!=='ACTIVE'?'disabled':''}" role="button" tabindex="0" data-action="wizard-category" data-val="${c.id}"><div class="row between"><span class="icon">${c.icon}</span>${statusText(c.state==='ACTIVE'?'Available':c.state==='PLANNED'?'Planned':'Restricted')}</div><strong>${c.name}</strong><p>${c.desc}</p></div>`).join('')}</div><div class="sep"></div>${w.category!=='apparel'?note('This category is not yet available for paid inspection. You may review its planned scope or submit an enquiry, but cannot checkout.','warning'):note('Apparel inspections are available under approved templates. Other categories use the same core order workflow when activated.','success')}`)}`}
else if(step===1){content=`${card(`${cardTitle('02 &nbsp; Choose an Inspection Service','Service type is independent from product category and inspection checklist.')}<div class="grid cols3">${[['inspection','Product Inspection','One to many individual pieces, inspected separately.','⌕'],['compare','Sample Comparison','Side-by-side checks for comparable sample sets.','⇄'],['reference','Reference Matching','Compare a new sample with an approved reference.','▱']].map(x=>`<div class="option-card ${w.service===x[0]?'selected':''}" tabindex="0" role="button" data-action="wizard-service" data-val="${x[0]}"><span class="icon">${x[3]}</span><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join('')}</div><div class="sep"></div>${select('Template / Item type','wizard-template',[['basic','Apparel Basic Visual v1'],['tops','Tops v1'],['leggings','Leggings v1'],['sports','Sports Bra v1']],'basic')}`)}`}
else if(step===2){
 const max=Number(w.qty)||1;
 const limit=Math.min(max,w.showAll?30:5);
 const lines=Array.from({length:limit},(_,i)=>`<tr><td class="mono">${String(i+1).padStart(2,'0')}</td><td><input class="input" style="min-width:95px" aria-label="Item ${i+1} SKU" value="${e(w.lines?.[i]?.sku||w.sku)}" data-action="line-update" data-i="${i}" data-field="sku"></td><td><input class="input" style="min-width:75px" aria-label="Item ${i+1} size" value="${e(w.lines?.[i]?.size||w.size)}" data-action="line-update" data-i="${i}" data-field="size"></td><td><input class="input" style="min-width:80px" aria-label="Item ${i+1} color" value="${e(w.lines?.[i]?.color||w.color)}" data-action="line-update" data-i="${i}" data-field="color"></td></tr>`).join('');
 const countField=field('Number of items / samples','w-qty','Quantity',w.qty,'number',`min="${w.service==='compare'?2:1}" max="${w.service==='compare'?6:60}"`);
 let mapping='';
 if(w.service==='inspection'){
   mapping=`<div class="row between flexwrap"><h3 style="margin:0">Item-level mapping (${max} items)</h3><div class="row">${[1,5,30].map(n=>act(n+' items','wizard-preset','sm',`data-qty="${n}"`)).join('')}</div></div><p class="small muted">Each item is checked independently; no automatic side-by-side comparison is created.</p><div class="tablewrap"><table class="tbl"><thead><tr><th>#</th><th>Item SKU</th><th>Size</th><th>Color</th></tr></thead><tbody>${lines}</tbody></table></div>${max>5?act(w.showAll?'Show first five':'Edit all '+max+' items','wizard-all','sm'):''}`;
 }else{
   mapping=note('Samples may arrive in separate parcels. Comparison starts only when all required compatible samples have been identified.');
 }
 content=card(`${cardTitle('03 &nbsp; Product & Sample Details','Dynamic attributes come from the approved category schema.')}<div class="fields">${field('Product name','w-name','Product title',w.name)}${field('Supplier reference','w-supplier','Supplier code (optional)',w.supplier)}${field('Item code / SKU','w-sku','SKU',w.sku)}${field('Color / Variant','w-color','Black',w.color)}${field('Size (apparel template)','w-size','M',w.size)}${countField}</div><div style="margin-top:16px">${field('Product reference link (optional)','w-link','https://supplier.example/item',w.link,'url')}</div><div class="sep"></div>${mapping}`);
}
else if(step===3){const checkDefs=[['visual','Visual appearance & packaging','Document visible condition of sample and packaging'],['measure','Dimensions & size measurements','Tape-measure photos with units and method'],['seams','Seams & visible workmanship','Stitching, loose thread and observable finishing'],['labels','Tags & accessories','Check attached labels and included parts'],['closeups','Additional detail photographs','Optional evidence capture, subject to scope']];content=`${card(`${cardTitle('04 &nbsp; Inspection Scope','The selected template controls supported and required checks.')}<div class="checklist">${checkDefs.map(x=>`<label class="checkrow"><input type="checkbox" data-action="scope-check" data-val="${x[0]}" ${w.checks.includes(x[0])?'checked':''}><span><strong>${x[1]}</strong><div class="small muted">${x[2]}</div></span></label>`).join('')}</div><div style="margin-top:14px">${area('Special instructions','w-instructions','Any product-specific concerns…',w.instructions)}</div><div class="sep"></div>${note('Laboratory fiber analysis, dye color ΔE, electrical safety, regulatory certification and untested batch conformity are excluded. Measurements require approved methods and recorded tools.')}`)}`}
else if(step===4){content=`${card(`${cardTitle('05 &nbsp; Review Your Quote','Server price rules are authoritative in production; this prototype uses labeled test values.')}<div class="grid cols2">${def('Product category','Apparel')}${def('Service',w.service==='inspection'?'Product Inspection':w.service==='compare'?'Sample Comparison':'Reference Matching')}${def('Items / samples',w.qty)}${def('Template','Apparel Basic Visual v1')}</div><div class="sep"></div><div class="row between"><strong>Inspection service fee · test estimate</strong><h2 style="margin:0">${money(newQuote())}</h2></div><div class="row between muted small" style="margin-top:9px"><span>Domestic forwarding / future storage charges</span><span>Quoted separately</span></div><div class="sep"></div><label class="checkrow"><input id="w-terms" type="checkbox" data-action="wizard-terms" ${w.terms?'checked':''}>I understand this is a sample-level observational service, not a laboratory certificate or full-batch guarantee, and have reviewed the demo terms.</label><div style="margin-top:13px">${note('Quote expires and service eligibility can change before a production order is submitted. Historical confirmed quotes must retain their own immutable price snapshot.','warning')}</div>`)}`}
else if(step===5){content=`${card(`${cardTitle('06 &nbsp; Pay & Send Your Samples','Payment is simulated locally; no live provider is contacted.')}<div class="grid cols2">${def('Order item','Apparel / '+(w.service==='inspection'?'Individual inspection':w.service==='compare'?'Sample comparison':'Reference matching'))}${def('Service estimate',money(newQuote()))}${def('Receiving code','<span class="mono">QCW-8F2K5</span>')}${def('Order status','Prototype / awaiting confirmation')}</div><div class="sep"></div>${note('<strong>No real payment is possible in this prototype.</strong> The production system must confirm a provider-signed server callback; a browser redirect is not proof of payment.','warning')}<div class="row flexwrap" style="margin-top:17px">${act('Simulate payment confirmation & create demo order','wizard-demo-pay','primary')}${B('View receiving address',R.account,'sm')}</div>`)}`}
return `${head('Create an Inspection','Choose a category, service, item list and evidence scope. Review before paying.',B('View My Orders',R.orders,'sm'),'C04')}<div class="wizard-shell"><div class="wizard-content">${wizardProgress()}${content}<div class="wizard-controls">${act('← Previous','wizard-back','',step===0?'disabled':'')}${step<5?act(step===4?'Continue to Payment →':'Continue →','wizard-next','primary',w.category!=='apparel'||(step===4&&!w.terms)?'disabled':''):B('Save Draft & Exit',R.orders,'sm')}</div></div><aside class="wizard-side">${card(`${cardTitle('Order Summary','Synchronized with your current selections.')} ${tag('DRAFT','yellow')}<div class="sep"></div><div class="mini-kv">${def('Category',CATS.find(c=>c.id===w.category)?.name||'—')}${def('Service',w.service==='inspection'?'Individual':w.service==='compare'?'Comparison':'Reference')}${def('Items',w.qty)}${def('Location','China')}</div><div class="sep"></div><div class="display-quote"><div class="label">DEMO SERVICE FEE</div><div class="big">${newQuote()==null?'Unavailable':money(newQuote())}</div><div class="small muted">Excludes shipping, storage, taxes and other unapproved fees.</div></div><div class="sep"></div>${act('Reset draft','wizard-reset','sm')} `)}${card(`<strong>Evidence-based inspections</strong><p class="small" style="margin:8px 0 0">All checks attach results to the exact physical sample, template version and measurement method.</p>`)}</aside></div>`}
function ordersPage(){return `${head('My Orders','Track active inspections, required actions and published reports.',B('Create New Inspection',R.new,'primary'),'C02')}<div class="stats">${stat('Total orders',state.orders.length,'Includes local demo orders')}${stat('Action required',2,'Tracking and sample instructions')}${stat('Inspections in progress',state.orders.filter(o=>o.status==='In review').length,'Synthetic status')}${stat('Reports available',state.orders.filter(o=>o.status==='Report ready').length,'Published demo reports')}</div>${card(`${cardTitle('Inspection orders','Search by order number, service or status.') }<div class="selectbar"><div class="search"><input id="orders-search" placeholder="Find an order…" aria-label="Search orders"></div>${B('Action required',R.actions,'sm')}</div><div id="orders-table">${orderTable()}</div>`)}${card(`${cardTitle('Saved draft','Your new-order wizard remains saved in this browser.') }<div class="row between"><div><strong>Apparel · ${state.wizard.service==='inspection'?'Product Inspection':state.wizard.service==='compare'?'Sample Comparison':'Reference Matching'}</strong><p class="small" style="margin:4px 0 0">${state.wizard.qty} samples / items · Step ${state.wizard.step+1} of 6</p></div>${B('Continue Draft',R.new,'sm')}</div>`)}`}
function actionsPage(){return `${head('Action Required','Resolve missing parcel details, pricing approvals and sample handling decisions.',B('View Orders',R.orders,'sm'),'C03')}<div class="grid cols2">${[['Tracking number needed','Tell us the original seller parcel tracking number for order '+O2,'Parcel details',R.parcels,'yellow'],['Choose sample disposition','Your report is ready. Decide which samples to store, return or forward.','Set item instructions',R.dispositions,'blue'],['Shipping quote awaiting review','Confirm the item list, destination and quote version.','Review quote',R.quote,'yellow'],['Reference sample pending','Reference matching cannot start until the approved sample is identified.','View order',R.order,'gray']].map(x=>card(`<div class="row between">${tag(x[4]==='yellow'?'Action needed':'Follow-up',x[4])}<span class="small muted">Demo</span></div><h3 style="margin:14px 0 8px">${x[0]}</h3><p class="small">${x[1]}</p>${B(x[2]+' →',x[3],'sm')}`)).join('')}</div>`}
function detailId(p){let x=p.match(/QW-[A-Za-z0-9-]+/);return x?.[0]||O}
function orderDetail(p){const id=detailId(p);const order=state.orders.find(o=>o.id===id);if(!order)return head('Order not found','No matching demo order.','','C05')+card('<div class="empty">No record.</div>');return `${head('Inspection Order',`Order ${id} · ${order.service}`,`${B('Download report',R.report,'sm')}${B('New inspection',R.new,'primary')}`,'C05')}<div class="grid cols4">${stat('Service fee',money(order.amount),'Test price / selected order')}${stat('Items',order.items,'Each item tracked independently')}${stat('Status',statusText(order.status),'Detailed stage below')}${stat('Receiving code','QCW-8F2K5','Permanent customer identity')}</div><div class="detail-layout"><div>${card(`${cardTitle('Next recommended action','Physical parcel receipt and service readiness are separately confirmed.')}<div class="row flexwrap">${order.status==='Report ready'?B('Choose Sample Disposition',R.dispositions,'primary'):B('Track Parcel',R.parcels,'primary')}${B('Billing',R.payment)}${B('See Full Timeline',R.shipment)}</div>`)}${card(`${cardTitle('Order items & status')} ${tbl(['Sample / Item','Identity','Inspection','Handling'],(order.samples.length?order.samples:Array.from({length:Math.min(order.items,5)},(_,i)=>'S-PENDING-'+(i+1))).map((x,i)=>[link(R.items,e(x),'mono'),i===0?'Verified':'Pending / Verified',statusText(i===0?'Inspected':'Awaiting confirmation'),B('Instructions',R.dispositions,'sm')]))}`)}${card(`${cardTitle('Event timeline')} ${timeline([['Order created',order.created+' · Customer'],['Seller shipment registered','2026-11-03 10:12 CST','Carrier confirmation is not physical receipt'],['Package physically checked in','2026-11-03 14:22 CST','Warehouse intake performed separately'],['Inspection evidence recorded','2026-11-04 09:55 CST','Individual sample IDs retained'],['Report published','2026-11-04 17:24 CST','Independent review (demo)']])}`)}</div><aside>${card(`${cardTitle('Quick links')}<div class="grid" style="gap:8px">${[[R.payment,'Payment details'],[R.parcels,'Parcels & tracking'],[R.report,'Inspection report'],[R.dispositions,'Item handling'],[R.storage,'Storage'],[R.after,'After-sales'],[R.case,'Support case']].map(x=>B(x[1]+' →',x[0],'full sm')).join('')}</div>`)}${card(`${cardTitle('Customer delivery address')}<div class="small muted">Current receiving address is issued with your permanent personal receiving code after registration.</div><div class="sep"></div>${B('Copy receiving details',R.account,'sm')}`)}</aside></div>`}
function paymentPage(){return `${head('Payment Details',`Order ${O} · service and handling charges are tracked separately.`,B('Back to Order',R.order,'sm'),'C06')}${note('This is a UI demonstration. A production payment must be confirmed from a verified provider callback, not from a return page.','warning')}<div class="detail-layout" style="margin-top:17px"><div>${card(`${cardTitle('Charges & attempts')} ${tbl(['Charge','Amount','State','Reference'],[['Inspection service fee',money(99),tag('Paid · demo','green'),'CH-110'],['Domestic shipment quote','$12.00',tag(state.demoPaid?'Demo confirmed':'Not paid',state.demoPaid?'green':'yellow'),'CH-220'],['Storage extension','$0.00',tag('Not requested','gray'),'—']])}`)}${card(`${cardTitle('Charge details')}<div class="mini-kv">${def('Payment provider','Configured at deployment')}${def('Payment receipt','Not connected to live payments')}${def('Amount in order','USD, integer cents')}${def('Evidence','Only server-confirmed in production')}</div><div class="sep"></div>${act('Simulate a paid status','simulate-charge','primary')}`)}</div><aside>${card(`<h3>Payment handling</h3><p>Service, forwarding and storage each have a separate charge purpose and receipt. A failed attempt can be safely retried without double-charging the same item.</p>${B('My billing records',R.billing,'sm')}`)}</aside></div>`}
function parcelsPage(){return `${head('My Parcels','Register the seller’s original tracking number and follow English transport events.',B('Register a Parcel',R.parcels,'primary'),'C07')}${card(`${cardTitle('Register a seller shipment','You may register a parcel before placing an inspection order.')}<form id="parcel-form"><div class="fields three">${field('Seller tracking number','parcel-tracking','Carrier tracking number','','text','required')}${select('Carrier','parcel-carrier',[['SF Express','SF Express'],['YTO Express','YTO Express'],['ZTO Express','ZTO Express'],['Other','Other']], 'SF Express')}${select('Optional order','parcel-order',[['','Not assigned yet'],...state.orders.map(o=>[o.id,o.id])],'')}</div><div style="margin-top:14px"><button class="btn primary" type="submit">Register parcel · demo</button></div></form>`)}${card(`${cardTitle('Registered parcels','Carrier delivery and physical warehouse intake are separate facts.')} ${tbl(['Package','Seller tracking','Carrier','Related order','Status',''],state.parcels.map(p=>[link('/parcels/'+p.id,e(p.id),'mono'),`<span class="mono">${e(p.tracking)}</span>`,e(p.carrier),p.order?link('/orders/'+p.order,e(p.order)):'Unassigned',statusText(p.status),B('Tracking',`/parcels/${p.id}`,'sm')]))}`)}`}
function parcelDetail(p){let id=p.split('/').pop();let item=state.parcels.find(x=>x.id===id)||state.parcels[0];return `${head('Parcel Tracking',`Package ${e(item.id)} · Seller-provided tracking record.`,B('All Parcels',R.parcels,'sm'),'C17')}<div class="grid cols4">${stat('Carrier',e(item.carrier),'Seller-reported')}${stat('Tracking number',`<span style="font-size:16px" class="mono">${e(item.tracking)}</span>`,'Original shipment')}${stat('Transport status',statusText(item.status),'As of last demo event')}${stat('Warehouse intake',item.status.includes('Received')?'Confirmed':'Not confirmed','Independent physical event')}</div><div class="detail-layout"><div>${card(`${cardTitle('Shipment events (English)','Synthetic examples; no carrier data is retrieved.')}${timeline([['Package information received','Nov 2, 2026 · 18:15 CST','Seller registered parcel'],['In transit','Nov 3, 2026 · 06:20 CST','Carrier transport event'],['Carrier delivery scan','Nov 3, 2026 · 13:58 CST','Not equal to warehouse intake'],['Warehouse physical check-in','Nov 3, 2026 · 14:22 CST','Recorded by warehouse staff']])}`)}${card(`${cardTitle('Report an incorrect tracking number')}<div class="fields">${field('Corrected tracking reference','track-correction','Enter updated number')}${area('Reason for correction','track-reason','Explain the change')}</div><div style="margin-top:13px">${act('Submit correction request','submit-correction','sm')}</div>`)}</div><aside>${card(`<h3>Associated inspection</h3><p>${item.order?link('/orders/'+item.order,item.order):'No order assigned'}</p>${note('Unrecognized parcels are held for staff verification. Customer ownership is not inferred from tracking number alone.','warning')}`)}</aside></div>`}
function exceptionPage(){return `${head('Resolve a Sample Exception','A sample identity or arrival difference requires your explicit instruction.',B('Back to Order',R.order,'sm'),'C08')}${card(`${cardTitle('Declared vs physically received')} ${tbl(['Field','Declared','Observed'],[['Item code','TS-240','TS-240'],['Color','Black','Dark charcoal'],['Quantity','3 samples','3 samples'],['Condition','New','1 minor visible packaging mark']])}`)}${card(`${cardTitle('Choose a resolution','Changes to count or sample groups may require a new price and your acceptance.')}<div class="grid cols3">${[['accept','Accept as received','Proceed with the documented difference'],['replace','Replace sample','Request the supplier send a replacement'],['return','Return item','Obtain seller return instructions'],['hold','Hold for clarification','Pause while you decide'],['convert','Convert 3 to 2','Requires valid comparison scope and price review']].map(x=>`<label class="option-card"><input type="radio" name="resolution" value="${x[0]}" ${x[0]==='hold'?'checked':''}><strong>${x[1]}</strong><p>${x[2]}</p></label>`).join('')}</div><div style="margin-top:14px">${act('Save demo resolution','save-resolution','primary')}</div>`)}`}
function reportsList(){return `${head('My Inspection Reports','Find versioned reports, download via browser print and manage sharing.',B('New Inspection',R.new,'primary'),'C23')}${card(`${cardTitle('Published reports','Synthetic records only. In production, evidence and PDF access are tenant-scoped.')} ${tbl(['Report','Order','Version','Published','Summary',''],[[link(R.report,'RPT-102','mono'),link(R.order,O,'mono'),`v${state.reportVersion}`,'Nov 4, 2026',tag(state.reportState==='published'?'Published':'Pending review',state.reportState==='published'?'green':'yellow'),B('Open report',R.report,'sm')],[link(R.reportold,'RPT-102 old','mono'),O,'v1','Nov 3, 2026',tag('Historical','gray'),B('View v1',R.reportold,'sm')]])}`)}`}
function customerReport(p){const old=p.includes('/versions/');if(!old&&state.reportState!=='published')return head('Report Not Published','The inspection is pending independent review. No report version is available for sharing.',B('My Reports',R.reports,'sm'),'C09')+card('<div class="empty"><strong>Report pending</strong><p>A completed inspection task is not the same as an approved and published report.</p></div>');return `${head(old?'Historical Report Version':'Inspection Report',`RPT-102 · Order ${O} · version ${old?1:state.reportVersion}`,`${act('Print / Save PDF','print-report','sm')} ${B('My Reports',R.reports,'sm')}`,'C09')}${note('SYNTHETIC REPORT: all sample IDs, values and imagery on this screen are illustrative, not a real quality judgment.','warning')}<div class="detail-layout" style="margin-top:16px"><div>${reportView(false,old)}</div><aside>${card(`${cardTitle('Report Version History','Published versions are immutable.')}<div class="grid" style="gap:9px">${B('Version '+state.reportVersion+' · Current',R.report,'sm')}${B('Version 1 · Historical',R.reportold,'sm')}</div><div class="sep"></div>${act(state.shareEnabled?'Revoke demo share link':'Enable demo share link','toggle-share','sm')}<div style="margin-top:10px">${state.shareEnabled?B('Preview share page',R.share,'sm'):tag('Share disabled','gray')}</div><div class="sep"></div>${B('Raise a report question',R.after,'sm')}`)}${card(`<h3>Report status</h3>${statusText(state.reportState==='published'?'Published demo':'Awaiting review')}<p class="small" style="margin-top:10px">Only an independent reviewer can approve and publish in the production workflow.</p>`)}</aside></div>`}

otes','Fragile items, requested packaging…',d.notes)}</div><div style="margin-top:15px">${act('Preview handling & quote','save-disposition','primary')}</div>`)}</div><aside>${card(`${cardTitle('Current selection')}<div class="mini-kv">${def('Selected items',d.ids.length)}${def('Handling',d.method)}${def('Quote version','QT-001 · Draft')}${def('Payment','Not confirmed')}</div><div class="sep"></div>${B('Review shipping quote',R.quote,'sm full')}`)}${card(`<h3>Return-to-seller rule</h3><p>The buyer first requests and confirms the seller return. QCWarehouse can ship the selected product to the address provided; it does not negotiate the refund.</p>`)}</aside></div>`}
function quotePage(){return `${head('Shipping & Handling Quote','QT-001 · Exact item list, destination, measured weight and quote version.',B('Edit instructions',R.dispositions,'sm'),'C11')}${card(`${cardTitle('Quote summary · demo only','A price cannot be finalized before the parcel and destination are physically confirmed.')}<div class="grid cols4">${def('Samples selected',state.disposition.ids.length)}${def('Destination',state.disposition.address||'Not supplied')}${def('Weight','Awaiting warehouse weighing')}${def('Quote state',state.disposition.quoteAccepted?'Accepted · demo':'Draft / review needed')}</div><div class="sep"></div>${tbl(['Component','Estimated amount','Condition'],[['Domestic carriage','$8.00','Illustrative only'],['Packing & materials','$4.00','Illustrative only'],['Inspection service fee','$0.00','Paid separately'],['TOTAL','$12.00','Prototype / requires updated verified quote']])}<div style="margin-top:17px">${act('Simulate accepting quote','accept-quote','primary')} ${B('Review item instructions',R.dispositions,'sm')}</div>`)}${note('Acceptance of a stale price must not authorize actual charge or dispatch in production. Changes to item list or address invalidate the previous authorization.','warning')}`}

function storagePage(){return `${head('Sample Storage','Track item-specific storage deadlines and authorized extensions.',B('Handle Items',R.dispositions,'primary'),'C13')}${card(`${cardTitle('Stored items')} ${tbl(['Sample','Storage until','Extension','Status','Next action'],[['S-003101','2026-12-04 CST','Not requested',tag('In storage','blue'),B('Handling',R.dispositions,'sm')],['S-003102','2026-12-04 CST','Not requested',tag('In storage','blue'),B('Handling',R.dispositions,'sm')],['S-003103','2026-12-04 CST','Not requested',tag('In storage','blue'),B('Handling',R.dispositions,'sm')]])}`)}${card(`${cardTitle('Extend storage','Illustrative charge depends on an approved, active fee schedule.')}<div class="row flexwrap">${tag('Trial configuration: 30 free days','blue')}${tag('Draft extension: $3 / item / 30 days','gray')}</div><div class="sep"></div>${act('Request a storage extension','request-storage','primary')}`)}`}
function afterSalesPage(){return `${head('After-sales & Report Questions','Raise cancellation, refund, reinspection or report discrepancy requests.',B('View Report',R.report,'sm'),'C14')}${card(`<form id="after-form"><div class="fields">${select('Case type','after-type',[['report','Report discrepancy'],['reinspect','Request re-inspection'],['cancel','Order cancellation'],['refund','Payment refund review']],'report')}${field('Related order','after-order','Order ID',O)}</div><div style="margin-top:15px">${area('Issue and evidence','after-message','Describe what needs review and provide supporting details…')}</div><div style="margin-top:16px"><button class="btn primary" type="submit">Submit case · demo</button></div></form>`)}${card(`${cardTitle('Previous case records')} ${tbl(['Case','Request','Status',''],[['CS-001','Measurement question',tag('Open','yellow'),B('Open case',R.case,'sm')]])}`)}${note('A requested refund is not a successful payment reversal. Production approval, provider execution and funds settlement are independent facts.')}`}
function casePage(){return `${head('Support Case CS-001','Customer-visible messages only. Internal staff notes never appear here.',B('After-sales',R.after,'sm'),'C15')}${card(`${cardTitle('Conversation thread')} ${timeline(state.cases.map(c=>[e(c.message),c.time,'Message visible to customer']))}`)}${card(`<form id="case-form">${area('Write a reply','case-message','Add context for the support team…','','1000')}<div style="margin-top:12px"><button type="submit" class="btn primary">Send message · demo</button></div></form>`)}${note('Case messages are locally saved as demonstration data; no email or ticket service is connected.')}`}
function accountPage(){return `${head('My Account & Receiving Address','Your account-level receiving code exists independently of any inspection order.',B('Account Security',R.security,'sm'),'C16')}<div class="detail-layout"><div>${card(`${cardTitle('My China Receiving Details','Use the exact published warehouse address in production; the demonstration uses a fictional placeholder.')}<div class="grid cols2">${def('Permanent receiving code','<span class="mono">QCW-8F2K5</span>')}${def('Recipient name','QCW-8F2K5 / Demo Customer')}${def('Receiving address','Demo warehouse — NOT A SHIPPING ADDRESS')}${def('Warehouse phone','Not configured in this prototype')}</div><div class="sep"></div>${act('Copy demo receiving code','copy-code','primary')} ${B('Register seller tracking',R.parcels,'sm')}`)}${card(`${cardTitle('Profile & notifications')}<div class="fields">${field('Display name','profile-name','Name','Sample Studio')}${field('Contact email','profile-email','Email','demo@qcw.test','email')}</div><div style="margin-top:13px">${act('Save local profile','save-profile','sm')}</div><div class="sep"></div>${note('Notification delivery status: unconnected in prototype. An actual email provider must report accepted, bounced and suppressed events.','warning')}`)}</div><aside>${card(`<h3>Account and ownership</h3><p>Package ownership is not determined solely by a tracking number, username, or email address. Staff verify receipts and parcel codes before binding them to your samples.</p>${B('Security settings',R.security,'sm full')}`)}${card(`${cardTitle('Quick actions')}<div class="grid" style="gap:8px">${B('My Parcels',R.parcels,'sm')}${B('My Items',R.items,'sm')}${B('Billing History',R.billing,'sm')}</div>`)}</aside></div>`}
function securityPage(){return `${head('Account Security','Connected identity providers, notification email and active sessions.',B('Account',R.account,'sm'),'C19')}${card(`${cardTitle('Sign-in methods','A provider identity is based on its verified subject and issuer, never merged by email alone.')} ${tbl(['Method','Status','Action'],[['Google',tag('Connected · demo','green'),act('Manage','security-action','sm','data-scope="Google method"')],['Microsoft',tag('Not connected','gray'),act('Connect','security-action','sm','data-scope="Microsoft method"')],['Email OTP',tag('Enabled · demo','blue'),act('Manage','security-action','sm','data-scope="Email OTP"')]])}`)}${card(`${cardTitle('Active sessions')} ${tbl(['Device','Last active','Action'],[['Desktop web','Just now (demo)',act('Revoke','security-action','sm','data-scope="Current session"')],['Other session','No other demo session',tag('None','gray')]])}`)}${note('Disconnecting the last available login method must be blocked by the production server. Sensitive actions require fresh identity verification.','warning')}`}
function recoveryPage(){return `${head('Recover Account Access','Identity recovery requires independent review; a receiving code or order ID is not sufficient.','','C20')}${card(`<form id="recovery-form"><div class="fields">${field('Contact email','recovery-email','Verified alternate contact','','email','required')}${field('Reference (optional)','recovery-ref','Case reference')}</div><div style="margin-top:15px">${area('Explain the access problem','recovery-message','What happened and what identity proof can you provide?')}</div><div style="margin-top:16px"><button type="submit" class="btn primary">Submit demo recovery request</button></div></form>`)}${note('The production response cannot reveal whether the supplied email belongs to an account. This prototype creates no real recovery or access change.','warning')}`}

function billingPage(){return `${head('Billing & Receipts','Every service, storage and shipment fee has its own purpose, attempt and settlement state.',B('Payment Details',R.payment,'sm'),'C22')}${card(`${cardTitle('Account charges')} ${tbl(['Charge ID','Purpose','Order','Amount','State',''],[['CH-110','Inspection service',O,'$99.00',tag('Paid · demo','green'),B('Details',R.payment,'sm')],['CH-220','Domestic shipping',O,'$12.00',state.demoPaid?tag('Demo paid','green'):tag('Unpaid','yellow'),B('Review quote',R.quote,'sm')],['CH-221','Storage extension',O,'$3.00',tag('Not requested','gray'),B('Storage',R.storage,'sm')]])}`)}${note('Gross invoice amount and payment processing costs are separate accounting records. No actual financial transactions happen in this prototype.')}`}
function customerPage(p){if(p===R.login)return customerLogin();if(p===R.signup)return customerLogin('signup');if(p===R.onboard)return onboarding();if(p===R.new)return wizardPremium();if(p===R.orders)return ordersPage();if(p===R.actions)return actionsPage();if(p===R.payment)return paymentPage();if(p===R.parcels||p===R.orderparcels)return parcelsPage();if(p.startsWith('/parcels/'))return parcelDetail(p);if(p.endsWith('/report')||p.includes('/report/versions/'))return customerReport(p);if(p.includes('/exceptions/'))return exceptionPage();if(p.endsWith('/dispositions'))return dispositionPage();if(p.includes('/quotes/'))return quotePage();if(p.includes('/shipments/'))return shipmentPage();if(p.endsWith('/storage'))return storagePage();if(p.endsWith('/after-sales'))return afterSalesPage();if(p.includes('/cases/'))return casePage();if(p===R.account)return accountPage();if(p===R.security)return securityPage();if(p===R.recovery)return recoveryPage();if(p===R.items)return itemsPage();if(p===R.billing)return billingPage();if(p===R.reports)return reportsList();if(/^\/orders\/QW-[A-Z0-9-]+$/.test(p))return orderDetail(p);return head('Page not found','Use the screen index to navigate.',B('All Screens',R.all,'primary'),'')}

function actHandler(type,el){const w=state.wizard;const val=el.dataset.val;
switch(type){
 case 'close-modal':closeModal();break;
 case 'reset-demo':modal('Reset all prototype records?','This will restore synthetic sample orders, report versions, item instructions and demo selections. No remote data exists.','Reset local demo','confirm-reset');break;
 case 'confirm-reset':state=clone(INITIAL);save();closeModal();go(R.all);toast('Demo records reset');break;
 case 'photo-preview':modal(el.dataset.title||'Evidence preview','This is an <strong>illustrative placeholder</strong>. No actual sample evidence photo is available in this front-end prototype.','Close');break;
 case 'wizard-category':w.category=val;w.step=0;save();render();break;
 case 'wizard-service':w.service=val;w.qty=val==='inspection'?1:val==='reference'?2:3;save();render();break;
 case 'wizard-preset':w.qty=Number(el.dataset.qty);w.showAll=false;save();render();break;
 case 'wizard-all':w.showAll=!w.showAll;save();render();break;
 case 'wizard-reset':modal('Reset the current draft?','The draft category, service, sample list and scope will return to their default test values.','Reset draft','confirm-wizard-reset');break;
 case 'confirm-wizard-reset':state.wizard=clone(INITIAL.wizard);save();closeModal();render();toast('Draft restored');break;
 case 'wizard-back':w.step=Math.max(0,w.step-1);save();render();break;
 case 'wizard-next':if(w.category!=='apparel'){toast('This category is not approved for paid inspections');break}if(w.step===4&&!w.terms){toast('Review and accept the demo scope statement first');break}if(w.step===2&&(!w.name.trim()||Number(w.qty)<1)){toast('Enter a product name and valid item count');break}if(w.step===2 && (Number(w.qty)>(w.service==='compare'?6:60)|| (w.service==='compare' && Number(w.qty)<2))){toast('Check the supported sample count for this service');break}w.step=Math.min(5,w.step+1);save();render();break;
 case 'wizard-demo-pay':{
  if(!w.terms||w.category!=='apparel'){toast('Please confirm the scope and choose an available category');break}
  const id='QW-DEMO-'+Date.now().toString(36).slice(-6).toUpperCase();let o={id,service:w.service==='inspection'?'Product Inspection':w.service==='compare'?'Sample Comparison':'Reference Sample Matching',category:'Apparel',items:Number(w.qty),amount:newQuote(),status:'Awaiting samples',created:new Date().toISOString().slice(0,10),samples:[]};state.orders.unshift(o);w.step=0;state.customerSignedIn=true;audit('Synthetic order created — no actual payment',id);go('/orders/'+id);toast('Demo order created. No real payment was taken.');break}
 case 'quick-quantity':w.service=el.dataset.service||'compare';w.qty=Number(el.dataset.qty);w.step=2;save();go(R.new);break;
 case 'toggle-share':state.shareEnabled=!state.shareEnabled;save();render();toast(state.shareEnabled?'Demo share page enabled':'Demo share page revoked');break;
 case 'print-report':window.print();break;
 case 'copy-code':copyText('QCW-8F2K5 — DEMO / NOT A SHIPPING ADDRESS');break;
 case 'copy-faq':copyText(location.href.split('#')[0]+'#/faq?faq='+el.dataset.faqIndex);break;
 case 'clear-faq':{let inp=$('#faq-search');if(inp)inp.value='';document.querySelectorAll('[data-faq]').forEach(x=>x.style.display='');break}
 case 'external-login':modal('External sign-in not connected',`In the real QCWarehouse system, “Continue with ${e(el.dataset.provider||'provider')}” redirects to a verified identity-provider flow. This standalone prototype cannot authenticate an account.<p>Use the email demo form to explore the customer experience.</p>`,'Continue');break;
 case 'staff-login':state.staffAuthed=true;save();go(el.dataset.target==='admin'?R.admin:R.wh);toast('Demo staff session opened; no authentication was performed.');break;
 case 'scan-preset':$('#scan-code').value=val;$('#scan-code').focus();break;
 case 'label-print':modal('Label printing · prototype',`A real label would encode an immutable sample identifier (<span class="mono">${S}</span>) and be printed to a verified device. No printer is connected here.`,'Close');break;
 case 'retry-sync':modal('No external sync connection','This is a self-contained demo. In production, retries must preserve the draft, use unique media IDs, and prevent a stale revision from overwriting published data.','Close');break;
 case 'save-inspection':state.notes=$('#ins-notes')?.value||state.notes;save();toast('Inspection draft saved in this browser only');break;
 case 'submit-inspection':{
  state.notes=$('#ins-notes')?.value||state.notes;
  const missing=['identity','front','back','size','seams','labels'].filter(k=>!state.checksDone[k]);
  if(missing.length){toast('Complete all checklist items first: '+missing.join(', '));break}
  if(!state.samplePhotoNames.length){toast('Select evidence file(s) before submitting the demo inspection');break}
  state.inspectionStage='pending_review';state.reportState='pending_review';audit('Inspection submitted for independent review','INSP-204','inspector-01');go(R.review);toast('Synthetic inspection submitted; report is not yet published');break}
 case 'approve-report':{
  if(state.staffRole!=='reviewer'&&state.staffRole!=='admin'){modal('Role separation required','An inspection creator cannot approve their own report. Change the demonstration staff role to Reviewer in the warehouse overview first. This is a UI demonstration only.');break}

  state.inspectionStage='approved';state.reportState='published';state.reportVersion++;state.orders.find(o=>o.id===O).status='Report ready';audit('Synthetic report approved and versioned',RPT,'reviewer-01');go(R.report);toast('Report publication simulated · version '+state.reportVersion);break}
 case 'reject-report':modal('Return report for correction','A report revision must record an independent reviewer’s reason. <div class="field" style="margin-top:13px"><label for="review-reason">Correction reason</label><textarea id="review-reason" placeholder="Specify evidence or field requiring correction" required></textarea></div>','Return for correction','confirm-review-reject');break;
 case 'confirm-review-reject':{let reason=$('#review-reason')?.value.trim();if(!reason){toast('Provide the correction reason');break}state.reportState='returned';state.inspectionStage='in_progress';audit('Report returned: '+reason,RPT);closeModal();go(R.inspect);break}

 case 'save-resolution':{const r=document.querySelector('input[name="resolution"]:checked')?.value||'hold';modal('Demo resolution request recorded',`Selected: <strong>${e(r)}</strong>.<p>In production the server would validate the item, price changes and required separate authorization.</p>`);audit('Customer submitted exception choice: '+r,'EX-001');break}
 case 'scan-preset-unused':break;
 case 'finance-export':{
  const csv=['Order,Service revenue,Forwarding collected,Processing cost,Refund,Contribution','"'+O+'",99.00,12.00,5.30,0.00,93.70','"'+O2+'",145.00,0.00,,,'].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='QCWarehouse_demo_finance.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Synthetic CSV downloaded; not business revenue');break}

function handleInputChange(target){
 const id=target.id;if(id.startsWith('w-')){updateWizardField(id,target.value);if(id==='w-qty'){state.wizard.showAll=false;render()}}
 if(target.dataset.action==='scope-check'){let arr=state.wizard.checks;let v=target.dataset.val;state.wizard.checks=target.checked?[...new Set([...arr,v])]:arr.filter(x=>x!==v);save()}
 if(target.dataset.action==='wizard-terms'){state.wizard.terms=target.checked;save();render()}
 if(target.dataset.action==='disposition-item'){let a=state.disposition.ids,k=target.dataset.val;state.disposition.ids=target.checked?[...new Set([...a,k])]:a.filter(x=>x!==k);state.disposition.quoteAccepted=false;save()}
 if(target.dataset.action==='inspection-check'){state.checksDone[target.dataset.val]=target.checked;save();render()}
 if(target.dataset.action==='line-update'){let i=Number(target.dataset.i),k=target.dataset.field;state.wizard.lines??=[];state.wizard.lines[i]??={};state.wizard.lines[i][k]=target.value;save()}
 if(id==='staff-role'){state.staffRole=target.value;save();toast('演示角色已切换；这不是生产鉴权')}
 if(id==='pricing-service'||id==='pricing-qty'){let s=$('#pricing-service')?.value,q=Number($('#pricing-qty')?.value);let amount=s==='inspection'?29*q:s==='compare'?(q===2?59:q>=3?state.catalogPrice+(q-3)*30:null):45;$('#price-preview').textContent=amount?money(amount):'Not applicable';}
 if(id==='ins-photos'){state.samplePhotoNames=Array.from(target.files||[]).map(x=>x.name).slice(0,15);save();const el=$('#photo-filenames');if(el)el.textContent=state.samplePhotoNames.join('、')+' （仅记录文件名）'}
}

 if(id==='contact-form'){state.requestSent=true;save();modal('Enquiry recorded · local demo',`Enquiry reference <strong>INQ-DEMO-01</strong>.<p>No message was sent. For production this must create a customer-visible case or notification with delivery evidence.</p>`);return}
 if(id==='parcel-form'){const tr=$('#parcel-tracking')?.value.trim();if(!tr)return;const found=state.parcels.some(p=>p.tracking===tr);if(found){toast('This tracking number already exists in the local demo');return}const newId='P-DEMO-'+String(state.parcels.length+1).padStart(3,'0');state.parcels.unshift({id:newId,order:$('#parcel-order')?.value||'',tracking:tr,carrier:$('#parcel-carrier')?.value||'Other',status:'Seller-reported / not verified',receipt:'Not received'});audit('Demo parcel preregistered',newId);go(R.parcels);toast('Parcel preregistration saved locally. No carrier data retrieved.');return}
 if(id==='case-form'){const m=$('#case-message')?.value.trim();if(!m){toast('Enter a reply');return}state.cases.unshift({id:'CS-001',message:m,time:new Date().toISOString().slice(0,16)+' UTC'});save();render();toast('Demo case message saved locally');return}
 if(id==='after-form'){if(!$('#after-message')?.value.trim()){toast('Provide the issue details');return}audit('Demo after-sales case requested',$('#after-order')?.value||O);go(R.case);toast('Demo case opened, no support request sent');return}
 if(id==='recovery-form'){modal('Request submitted locally','In production a recovery request needs a non-disclosing acknowledgement, identity verification, independent approval, cooldown and audited execution. No account access was changed.');return}
 if(id==='staff-login-form'){state.staffAuthed=true;save();go(R.mfa);toast('Demo login stage; no credentials validated');return}
 if(id==='scan-form'){
  const code=$('#scan-code')?.value.trim().toUpperCase();const el=$('#scan-result');if(!el)return;
  const isPack=code===P||code==='SF10482258012',isSample=code===S;
  el.innerHTML=isPack?note(`<strong>已找到包裹 ${P}</strong>。承运商记录与实收记录分别可见。<br>${B('打开包裹详情',R.package,'sm')}`,'success'):isSample?note(`<strong>已找到样品 ${S}</strong>，库位 A-04-02-03。<br>${B('打开样品详情',R.sampledetail,'sm')}`,'success'):note('<strong>未找到可确认对象。</strong> 请保持未知包裹隔离，不能凭猜测认领客户。','warning');return}
 if(id==='location-generate-form'){
 const zone=$('#loc-zone').value,rack=Number($('#loc-rack').value),lev=Number($('#loc-level').value),start=Number($('#loc-start').value),end=Number($('#loc-end').value),capacity=Number($('#loc-capacity').value),usage=$('#loc-usage').value,memo=$('#loc-memo').value.trim();
 if(![rack,lev,start,end,capacity].every(Number.isInteger)||rack<1||rack>99||lev<1||lev>99||start<1||end>99||end<start||end-start>39||capacity<1||capacity>999){toast('请填写有效的编码范围（一次最多 40 个）');return}
 if((zone==='B'&&usage!=='REFERENCE')||(zone==='Q'&&usage!=='QUARANTINE')){toast('B 区为确认样，Q 区为隔离区；用途必须对应');return}
 let added=0,skipped=0;
 for(let n=start;n<=end;n++){let code=locationCode(zone,rack,lev,n);if(getLocation(code)){skipped++;continue}state.locationMaster.push({code,zone,rack:String(rack).padStart(2,'0'),level:String(lev).padStart(2,'0'),slot:String(n).padStart(2,'0'),usage,capacity,status:'ACTIVE',memo});added++}
 audit('Location master batch created: '+added+' added; '+skipped+' duplicate','zone '+zone,'admin-demo');save();go(R.adminlocations);toast('已新增 '+added+' 个库位，跳过重复 '+skipped+' 个（本地演示）');return
 }
 if(id==='intake-form'){
  if(!$('#intake-tracking').value.trim()){toast('请填写运单号');return} const dest=getLocation($('#intake-bin').value);if(!dest||dest.status!=='ACTIVE'){toast('请选择有效且启用的库位');return}
  state.parcels[0].status='Received at inspection center';state.parcels[0].receipt='Demo intake · China local time';audit('Physical intake confirmed locally',P,'receiving-demo');go(R.package);toast('演示实物入库已记录；没有接入实际仓库');return}
 if(id==='move-form'){
 const item=$('#move-item').value.trim().toUpperCase(), dest=getLocation($('#move-to').value);
 if(!item||!dest){toast('请选择有效的样品和目标库位');return}
 if(!state.itemBins[item]){toast('演示样品不存在，请使用 S-003101 等示例编号');return}
 if(dest.status!=='ACTIVE'||dest.usage!=='STANDARD'){toast('目标库位不可用或用途不匹配');return}
 const origin=itemBin(item);if(origin===dest.code){toast('目标库位与当前库位相同');return}
 state.itemBins[item]=dest.code;
 audit('Storage move: '+origin+' → '+dest.code,item,'warehouse-demo');save();
 modal('库位移转已记录 · 仅演示','样品 <b>'+e(item)+'</b> 从 <b>'+e(origin)+'</b> 移至 <b>'+e(dest.code)+'</b>。<p>已写入浏览器模拟数据，正式系统仍须逐件扫码、版本校验和审计。</p>');return
 }
 if(id==='dispatch-form'){
  const tr=$('#dispatch-tracking')?.value.trim();if(!tr){toast('需要填写真实面单号才能演示交接');return}
  if(!state.disposition.quoteAccepted||!state.demoPaid){modal('发运条件尚未满足','客户对精确商品和目的地的报价接受、款项确认和仓库实际交接是不同关口。请先通过客户门户模拟接受报价与付款。');return}
  state.shipmentStatus='Demo warehouse handoff (no carrier action)';audit('Demo package handoff with reference '+tr,'DP-020','warehouse-demo');go(R.shipment);toast('演示交接已记录，没有产生实际运输');return}
 if(id==='stocktake-form'){audit('Stocktake item observation: '+$('#stocktake-condition').value,$('#stocktake-code').value,'receiving-demo');toast('盘点观察已存入本地演示审计');return}
 if(id==='admin-ticket-form'){if(!$('#ticket-text').value.trim()){toast('请输入有效内容');return}audit('Ticket '+$('#ticket-scope').value+' note recorded','TK-104','support-demo');modal('消息已保存为本地演示记录','未发送邮件或真实客服回复。公开回复与内部备注在后端必须分别实施授权。');return}
 if(id==='config-form'){state.settingsSaved=true;audit('Demo configuration saved','CONFIG');toast('测试参数已保存到本地（不改变服务器规则）');return}
 if(id==='log-correction-form'){if(!$('#log-new').value.trim()||!$('#log-reason').value.trim()){toast('新运单号和修订理由均为必填');return}audit('Carrier correction request entered','TR-101');modal('运单修订待审批','本地模拟创建纠错记录，旧运单与历史轨迹仍然保留。');return}
 if(id==='incident-form'){if(!$('#incident-note').value.trim()){toast('记录证据和处理原因');return}audit('Incident handling proposal: '+$('#incident-solution').value,'INC-07');modal('事故处理建议已记录（演示）','库存出库冻结未解除，真实审批、赔偿与结案均需独立授权和证据。');return}
}

document.addEventListener('click',ev=>{const anchor=ev.target.closest('a[href^="#/"]');if(anchor)return;const nav=ev.target.closest('[data-go]');if(nav){ev.preventDefault();go(nav.dataset.go);return}const ctrl=ev.target.closest('[data-action]');if(ctrl&&(ctrl.tagName!=='INPUT'||ctrl.type!=='checkbox')){if(ctrl.matches('input[data-action="line-update"]'))return;ev.preventDefault();actHandler(ctrl.dataset.action,ctrl);return}});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role="button"][data-action]')){ev.preventDefault();actHandler(ev.target.dataset.action,ev.target)}});
document.addEventListener('change',ev=>handleInputChange(ev.target));
document.addEventListener('input',ev=>{
 const target=ev.target;
 if(target.id==='faq-search'){const v=target.value.trim().toLowerCase();document.querySelectorAll('[data-faq]').forEach(x=>x.style.display=x.dataset.faq.includes(v)?'':'none')}
 if(target.id==='orders-search'){const v=target.value.toLowerCase().trim();let cont=$('#orders-table');if(cont)cont.innerHTML=orderTable(state.orders.filter(o=>(o.id+o.service+o.status).toLowerCase().includes(v)))}
 if(target.id==='admin-orders-search'){const v=target.value.toLowerCase().trim();let cont=$('#admin-orders-table');if(cont)cont.innerHTML=orderTable(state.orders.filter(o=>(o.id+o.service+o.status).toLowerCase().includes(v)))}
 if(target.id?.startsWith('w-')&&target.id!=='w-qty')updateWizardField(target.id,target.value);
 if(target.dataset.action==='line-update')handleInputChange(target);
});
