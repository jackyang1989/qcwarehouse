  <text x="260" y="169" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">B</text>
  <!-- C: Underband Flat Width -->
  <line x1="190" y1="242" x2="330" y2="242" stroke="#2563eb" stroke-width="2"/>
