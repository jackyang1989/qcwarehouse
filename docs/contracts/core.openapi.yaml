          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - support
      - super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount_cents
              - reason
              properties:
                amount_cents:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 1
              additionalProperties: false
  /staff/orders/{id}/quotes:
    post:
      operationId: issueManualQuote
      summary: 对本人负责的人工询价，锁定逐行金额、交期和到期时间后发客户确认
      security:
      - cookieSession: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          format: uuid
        in: path
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - support
      - super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision
              - reason
              - expires_at
              - lines
              - terms_version_ids
              properties:
                revision:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 1
                expires_at:
                  type: string
                  format: date-time
                terms_version_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - order_line_id
                    - amount_cents
                    - business_days
                    properties:
                      order_line_id:
                        type: string
                        format: uuid
                      amount_cents:
                        type: integer
                        minimum: 0
                      business_days:
                        type: integer
                        minimum: 1
  /staff/reports/{id}/amend:
    post:
      operationId: amendReport
      summary: 以当前发布版本建立唯一修订草稿
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - reviewer
      - warehouse_admin
      - super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - base_version
              - reason
              properties:
                base_version:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 4
                  maxLength: 1000
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - version
                - state
                - revision
                properties:
                  id:
                    type: string
                    format: uuid
                  version:
                    type: integer
                    minimum: 1
                  state:
                    const: draft
                  revision:
                    type: integer
                    minimum: 1
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/reports/{id}:
    patch:
      operationId: editReportRevision
      summary: 作者按原检查模板编辑修订内容
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - reviewer
      - warehouse_admin
      - super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              - changes
              properties:
                revision:
                  type: integer
                  minimum: 1
                changes:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: object
                    required:
                    - section
                    - result
                    - status
                    - typed_value
                    - reason
                    properties:
                      section:
                        type: integer
                        minimum: 0
                      result:
                        type: integer
                        minimum: 0
                      status:
                        enum:
                        - RECORDED
                        - OBSERVED_ISSUE
                        - NOT_OBSERVED
                        - NOT_TESTED
                        - NOT_APPLICABLE
                      typed_value:
                        type:
                        - number
                        - boolean
                        - string
                        - 'null'
                      reason:
                        type: string
                        maxLength: 2000
                    additionalProperties: false
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - revision
                properties:
                  id:
                    type: string
                    format: uuid
                  revision:
                    type: integer
                    minimum: 1
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff/reports/{id}/submit-revision:
    post:
      operationId: submitReportRevision
      summary: 作者提交修订供独立复核
      security:
      - cookieSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - reviewer
      - warehouse_admin
      - super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - revision
                - state
                properties:
                  id:
                    type: string
                    format: uuid
                  revision:
                    type: integer
                    minimum: 1
                  state:
                    const: submitted
                additionalProperties: false
        default:
          description: See stable HTTP error codes in §7.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details:
              type: object
          additionalProperties: false
      additionalProperties: false
    Line:
      type: object
      required:
      - category_id
      - offer_id
      - quantity
      properties:
        category_id:
          type: string
          format: uuid
        offer_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        options:
          type: object
          additionalProperties: true
          description: Published template or versioned snapshot defines keys.
        attributes:
          type: object
          additionalProperties: true
          description: Published template or versioned snapshot defines keys.
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Published template or versioned snapshot defines keys.
          minItems: 0
      additionalProperties: false
    Order:
      type: object
      required:
      - id
      - public_no
      - state
      - revision
      properties:
        id:
          type: string
          format: uuid
        public_no:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    Quote:
      type: object
      required:
      - id
      - order_id
      - revision
      - currency
      - amount_cents
      - expires_at
      - line_snapshot
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        currency:
          type: string
          enum:
          - USD
        amount_cents:
          type: integer
          minimum: 0
        expires_at:
          type: string
          format: date-time
        line_snapshot:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
          minItems: 1
      additionalProperties: false
    Task:
      type: object
      required:
      - id
      - state
      - revision
      - template_version_id
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
        template_version_id:
          type: string
          format: uuid
      additionalProperties: false
    Charge:
      type: object
      required:
      - charge_item_id
      - amount_cents
      - currency
      properties:
        charge_item_id:
          type: string
          format: uuid
        amount_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - USD
        state:
          type: string
          enum:
          - open
          - processing
          - paid
          - void
      additionalProperties: false
    Parcel:
      type: object
      required:
      - id
      - state
      - revision
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    Result:
      type: object
      required:
      - item_key
      - component
      - attempt
      - status
      - method
      - is_final
      properties:
        item_key:
          type: string
          minLength: 1
        component:
          type: string
          minLength: 1
        attempt:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - RECORDED
          - OBSERVED_ISSUE
          - NOT_OBSERVED
          - NOT_TESTED
          - NOT_APPLICABLE
          - BLOCKED
        method:
          type: string
          minLength: 1
        is_final:
          type: boolean
        typed_value: {}
        unit:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
        details:
          type: object
          description: Template-validated severity, part and bilingual observations
      additionalProperties: false
      allOf:
      - if:
          properties:
            status:
              enum:
              - BLOCKED
              - NOT_TESTED
              - NOT_APPLICABLE
        then:
          required:
          - reason
          properties:
            typed_value:
              type: 'null'
      - if:
          properties:
            status:
              const: RECORDED
        then:
          required:
          - typed_value
          properties:
            typed_value:
              not:
                type: 'null'
    Tracking:
      type: object
      required:
      - tracking_id
      - direction
      - carrier
      - tracking_no
      - transport_state
      - sync_state
      - locale
      - translation_status
      - events
      - allowed_actions
      properties:
        tracking_id:
          type: string
          format: uuid
        direction:
          type: string
          minLength: 1
        carrier:
          type:
          - string
          - 'null'
        tracking_no:
          type: string
          minLength: 1
        transport_state:
          type: string
          minLength: 1
        sync_state:
          type: string
          minLength: 1
        locale:
          type: string
          enum:
          - en
          - zh-CN
        translation_status:
          type: string
          minLength: 1
        events:
          type: array
          items:
            type: object
            required:
            - id
            - text
            - source
            properties:
              id:
                type: string
                minLength: 1
              text:
                type: string
                minLength: 1
              source:
                type: string
                minLength: 1
              occurred_at:
                type: string
                format: date-time
              location:
                type: string
                minLength: 1
              status_code:
                type: string
                minLength: 1
            additionalProperties: false
          minItems: 0
        allowed_actions:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        warehouse_state:
          type:
          - string
          - 'null'
        last_success_at:
          type: string
          format: date-time
        latest_event_at:
          type: string
          format: date-time
        localized_snapshot_at:
          type: string
          format: date-time
        next_allowed_at:
          type: string
          format: date-time
      additionalProperties: false
    Instruction:
      type: object
      required:
      - id
      - item_id
      - state
      - revision
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        state:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
      additionalProperties: false
    Report:
      type: object
      required:
      - id
      - version
      - state
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        state:
          type: string
          minLength: 1
      additionalProperties: false
    Registration:
      type: object
      required:
      - user_id
      - org_id
      - receiving_code
      - warehouse_address_status
      properties:
        user_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        receiving_code:
          type: string
          minLength: 1
        warehouse_address_status:
          type: string
          enum:
          - available
          - pending
        warehouse_address:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - id
            - recipient
            - phone
            - address_zh
            - address_en
            properties:
              id:
                type: string
                format: uuid
              recipient:
                type: string
                minLength: 1
              phone:
                type: string
                minLength: 1
              address_zh:
                type: string
                minLength: 1
              address_en:
                type: string
                minLength: 1
      additionalProperties: false
    Checkout:
      oneOf:
      - type: object
        required:
        - state
        - attempt_id
        - checkout_url
        properties:
          state:
            type: string
            enum:
            - requires_payment
          attempt_id:
            type: string
            format: uuid
          checkout_url:
            type: string
            format: uri
        additionalProperties: false
      - type: object
        required:
        - state
        - charge_item_id
        properties:
          state:
            type: string
            enum:
            - processing
            - paid
          charge_item_id:
            type: string
            format: uuid
        additionalProperties: false
    QuoteLine:
      type: object
      additionalProperties: false
      required:
      - order_line_id
      - category_id
      - offer_id
      - template_version_id
      - quantity
      - price_version
      - amount_cents
      - business_days
      properties:
        order_line_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        offer_id:
          type: string
          format: uuid
        template_version_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        price_version:
          type: string
          format: uuid
        amount_cents:
          type: integer
          minimum: 0
        business_days:
          type: integer
          minimum: 1
        options:
          type: object
        capacity_note:
          type: string
          minLength: 1
    Bill:
      type: object
      additionalProperties: false
      required:
      - charge_item_id
      - purpose
      - state
      - amount_cents
      - currency
      - refunded_cents
      - order_ids
      properties:
        charge_item_id:
          type: string
          format: uuid
        purpose:
          enum:
          - inspection
          - dispatch
          - storage
        state:
          type: string
          minLength: 1
        amount_cents:
          type: integer
          minimum: 0
        currency:
          const: USD
        refunded_cents:
          type: integer
          minimum: 0
        order_ids:
          type: array
          items:
            type: string
            format: uuid
        batch_id:
          type: string
          format: uuid
        receipt_url:
          type: string
          format: uri
        latest_attempt_state:
          type: string
          minLength: 1
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: session
